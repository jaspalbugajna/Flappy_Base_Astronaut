<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Flappy Base Astronaut</title>
    <style>
        body { margin: 0; background: #0022aa; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { border: 4px solid white; background: linear-gradient(to bottom, #001133, #0052ff); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <h2>Flappy Base Astronaut</h2>
    <canvas id="flappy" width="400" height="600"></canvas>
    <script>
        const canvas = document.getElementById("flappy");
        const ctx = canvas.getContext("2d");
        let bird = { x: 50, y: 150, w: 30, h: 30, gravity: 0.6, lift: -10, velocity: 0 };
        let pipes = [], frameCount = 0, score = 0, isOver = false;

        window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { bird.velocity = bird.lift; if (isOver) resetGame(); } });
        canvas.addEventListener('click', () => { bird.velocity = bird.lift; if (isOver) resetGame(); });

        function resetGame() { bird.y = 150; bird.velocity = 0; pipes = []; score = 0; frameCount = 0; isOver = false; loop(); }

        function loop() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            bird.velocity += bird.gravity; bird.y += bird.velocity;
            if (bird.y + bird.h > canvas.height || bird.y < 0) isOver = true;

            if (frameCount % 100 === 0) {
                let h = Math.floor(Math.random() * 200) + 100;
                pipes.push({ x: canvas.width, top: h, bottom: canvas.height - h - 150, w: 60, passed: false });
            }

            ctx.fillStyle = '#00d2ff';
            pipes.forEach(p => {
                p.x -= 3;
                ctx.fillRect(p.x, 0, p.w, p.top);
                ctx.fillRect(p.x, canvas.height - p.bottom, p.w, p.bottom);
                if (bird.x < p.x + p.w && bird.x + bird.w > p.x && (bird.y < p.top || bird.y + bird.h > canvas.height - p.bottom)) isOver = true;
                if (!p.passed && p.x + p.w < bird.x) { score++; p.passed = true; }
            });
            pipes = pipes.filter(p => p.x + p.w > 0);

            ctx.fillStyle = '#ffffff'; ctx.fillRect(bird.x, bird.y, bird.w, bird.h);
            ctx.fillStyle = '#ffffff'; ctx.font = '24px Arial'; ctx.fillText(`Score: ${score}`, 20, 40);

            if (!isOver) requestAnimationFrame(loop);
            else {
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white'; ctx.font = '30px Arial'; ctx.textAlign = 'center';
                ctx.fillText('Game Over', canvas.width/2, canvas.height/2);
            }
        }
        loop();
    </script>
</body>
</html>
